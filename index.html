<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#167c48"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Soccer Shootout"><title>Innes Brothers Soccer Shootout</title><style>*{box-sizing:border-box}body{margin:0;background:#102f29;color:white;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}.app{max-width:600px;margin:auto;padding:12px}h1{font-size:clamp(21px,5vw,30px);text-align:center;margin:8px 0}header{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:10px}.pill{background:#ffffff22;border:1px solid #ffffff33;border-radius:14px;padding:8px 12px;font-weight:700}select,button{font:inherit;border:0;border-radius:12px;padding:9px 12px}button{background:#ffe26c;color:#26331b;font-weight:800;cursor:pointer}select{background:white;color:#123}.stage{position:relative;overflow:hidden;border-radius:18px;border:3px solid #ffffff44;touch-action:none;background:#78d5f3}canvas{display:block;width:100%;height:auto;touch-action:none}#message{text-align:center;font-size:18px;font-weight:800;min-height:54px;padding:12px 5px}.help{text-align:center;opacity:.85;font-size:14px}.scores{margin-top:14px;background:#ffffff12;border-radius:14px;padding:12px}.scores h2{font-size:17px;margin:0 0 7px}.scores div{padding:3px 0}footer{text-align:center;font-size:12px;opacity:.65;margin:12px}#aim{font-size:13px;text-align:center;opacity:.9}</style></head><body><main class="app"><h1>⚽ Innes Brothers Shootout</h1><header><label class="pill">Player <select id="player"><option>Cooper</option><option>Jesse</option><option>Jordan</option></select></label><span class="pill" id="score">Goals: 0 / 5</span><button id="restart">New round ↻</button></header><div class="stage"><canvas id="game" width="600" height="720" aria-label="Swipe upwards from the football to take a penalty"></canvas></div><div id="message" aria-live="polite">Swipe up from the ball to shoot!</div><div id="aim">Aim left or right and swipe quickly for a powerful shot.</div><section class="scores"><h2>🏆 Best rounds on this device</h2><div id="highscores"></div></section><footer>Made for the Innes Brothers • 5 penalties per round</footer></main><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),msg=document.querySelector('#message'),scoreEl=document.querySelector('#score'),playerEl=document.querySelector('#player'),highEl=document.querySelector('#highscores');const W=600,H=720,ballStart={x:300,y:605};let shots=0,goals=0,phase='ready',drag=null,ball={...ballStart},keeperX=300,keeperDir=1,flight=null,delay=0,last=0,particles=[];const storeKey='innes-soccer-best-v1';let best={};try{best=JSON.parse(localStorage.getItem(storeKey)||'{}')||{}}catch{};function scores(){highEl.innerHTML='';for(const name of ['Cooper','Jesse','Jordan']){const d=document.createElement('div');d.textContent=`${name}: ${best[name]??'—'} / 5`;highEl.append(d)}}function hud(){scoreEl.textContent=`Goals: ${goals} / 5`;scores()}function reset(){shots=0;goals=0;phase='ready';flight=null;drag=null;ball={...ballStart};particles=[];msg.textContent='Swipe up from the ball to shoot!';hud()}document.querySelector('#restart').onclick=reset;playerEl.onchange=reset;function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function rand(a,b){return a+Math.random()*(b-a)}function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}canvas.addEventListener('pointerdown',e=>{if(phase!=='ready')return;const p=point(e);if(Math.hypot(p.x-ballStart.x,p.y-ballStart.y)<115){drag=p;canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(drag)drag=point(e)});canvas.addEventListener('pointerup',e=>{if(!drag||phase!=='ready')return;const p=point(e);drag=null;const dy=ballStart.y-p.y;if(dy<75){msg.textContent='Swipe UP to shoot!';return}const dx=p.x-ballStart.x;const power=clamp(dy/360,.45,1.3);const targetX=clamp(300+dx*1.15,65,535);const targetY=clamp(235-(power-.75)*100,120,325);flight={start:performance.now(),duration:clamp(850-power*260,420,820),targetX,targetY,power};phase='flying';msg.textContent='GOOO...';});canvas.addEventListener('pointercancel',()=>drag=null);function line(x1,y1,x2,y2,color,width=3){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function ballDraw(x,y,r){ellipse(x+5,y+r*.85,r*.85,r*.24,'#143b2788');ellipse(x,y,r,'#fff');ctx.strokeStyle='#243b4b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#263747';ctx.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;const px=x+Math.cos(a)*r*.44,py=y+Math.sin(a)*r*.44;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill();for(let i=0;i<5;i++){const a=i*Math.PI*2/5;line(x+Math.cos(a)*r*.52,y+Math.sin(a)*r*.52,x+Math.cos(a)*r*.92,y+Math.sin(a)*r*.92,'#34485a',1.7)}}function keeper(x,lean=0){ctx.save();ctx.translate(x,258);ctx.rotate(lean);ellipse(0,78,53,9,'#153a2777');line(-13,41,-21,74,'#182e52',13);line(13,41,21,74,'#182e52',13);rect(-30,5,60,43,'#f34b50');rect(-28,44,56,9,'#223b70');line(-25,15,-62,0,'#f5bc85',13);line(25,15,62,0,'#f5bc85',13);ellipse(-66,-2,13,10,'#fff6ab');ellipse(66,-2,13,10,'#fff6ab');ellipse(0,-16,23,25,'#efb884');ellipse(-7,-20,2.8,3.3,'#20242b');ellipse(8,-20,2.8,3.3,'#20242b');ctx.beginPath();ctx.arc(0,-12,8,.1,Math.PI-.1);ctx.strokeStyle='#7b493b';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#4c3028';ctx.beginPath();ctx.arc(0,-32,23,Math.PI,0);ctx.fill();ctx.restore()}function background(){rect(0,0,W,H,'#78d6f5');ellipse(510,75,50,50,'#ffe76b');for(let i=0;i<5;i++){ellipse(i*150-20,170,130,90,'#6ab58a')}rect(0,178,W,H-178,'#3cb75d');for(let i=0;i<7;i++)rect(0,220+i*75,W,37,i%2?'#32a952':'#4dc369');ctx.strokeStyle='#ffffffb8';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(300,485,185,75,0,0,Math.PI*2);ctx.stroke();line(0,475,W,475,'#ffffff99',3);ctx.fillStyle='#164d38';ctx.beginPath();ctx.moveTo(95,197);ctx.lineTo(505,197);ctx.lineTo(548,375);ctx.lineTo(52,375);ctx.closePath();ctx.fill();ctx.strokeStyle='#e7ffffaa';ctx.lineWidth=2;for(let i=0;i<=10;i++){let x=95+i*41;line(x,197,52+i*49.6,375,'#d7ffff88',1)}for(let y=212;y<=375;y+=22)line(95-(y-197)*.24,y,505+(y-197)*.24,y,'#d7ffff77',1);line(95,195,505,195,'#fff',13);line(95,195,52,375,'#fff',11);line(505,195,548,375,'#fff',11);line(52,375,548,375,'#fff',7)}function resolve(){const f=flight;const inside=f.targetX>85&&f.targetX<515&&f.targetY>195&&f.targetY<355;const keeperReach=Math.abs(f.targetX-keeperX)<72&&Math.abs(f.targetY-270)<105;const saved=inside&&keeperReach;const goal=inside&&!saved;if(goal)goals++;shots++;phase='result';delay=performance.now()+1250;msg.textContent=goal?'⚽ GOAL! Brilliant shot!':saved?'🧤 SAVED by the keeper!':'❌ Wide! Try again!';for(let i=0;i<(goal?35:8);i++)particles.push({x:f.targetX,y:f.targetY,vx:rand(-4,4),vy:rand(-7,-1),life:rand(25,55),color:['#ffde5b','#f65d79','#fff','#71ddff'][i%4]});hud()}function tick(now){const dt=Math.min((now-last)/16.67||1,3);last=now;keeperX+=keeperDir*2.15*dt;if(keeperX>425){keeperX=425;keeperDir=-1}if(keeperX<175){keeperX=175;keeperDir=1}background();keeper(keeperX,phase==='flying'?(flight.targetX-keeperX)*.001:0);if(phase==='flying'){const t=clamp((now-flight.start)/flight.duration,0,1),ease=1-Math.pow(1-t,2);ball.x=ballStart.x+(flight.targetX-ballStart.x)*ease;ball.y=ballStart.y+(flight.targetY-ballStart.y)*ease-70*Math.sin(Math.PI*t);ballDraw(ball.x,ball.y,clamp(27-16*t,11,27));if(t>=1)resolve()}else if(phase==='ready'){ballDraw(ballStart.x,ballStart.y,27);if(drag){line(ballStart.x,ballStart.y,drag.x,drag.y,'#ffe16b',6);ellipse(drag.x,drag.y,9,9,'#ffe16b')}}else if(phase==='result'){ballDraw(flight.targetX,flight.targetY,11);if(now>delay){if(shots>=5){phase='finished';const name=playerEl.value;if(goals>(best[name]??-1)){best[name]=goals;try{localStorage.setItem(storeKey,JSON.stringify(best))}catch{}}msg.textContent=`🏆 ${name} scored ${goals}/5! Tap New round to play again.`;scores()}else{phase='ready';ball={...ballStart};msg.textContent='Next penalty! Swipe up to shoot.'}}}else if(phase==='finished')ballDraw(ballStart.x,ballStart.y,27);particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.16*dt;p.life-=dt;ellipse(p.x,p.y,5,5,p.color)}requestAnimationFrame(tick)}hud();requestAnimationFrame(tick)})();
</script></body></html>
